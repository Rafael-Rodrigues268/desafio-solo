<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canil - Tarefas</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous" />

<style>
  body {
    background-color: #f9f7f3; /* off-white quente */
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  header {
    background: linear-gradient(90deg, #d4af37, #f7e4a0); /* dourado suave para dourado claro */
    padding: 1rem 0;
  }

  header nav {
    display: flex;
    justify-content: center;
    gap: 2rem;
  }

  header nav a {
    color: #5a4d2e; /* marrom-dourado escuro */
    font-weight: 600;
    text-decoration: none;
    transition: color 0.3s ease;
  }

  header nav a:hover {
    color: #bfa34a; /* dourado médio no hover */
  }

  h1 {
    text-align: center;
    color: #8a6d1c; /* dourado queimado */
    margin-bottom: 2rem;
  }

  .table-container {
    display: flex;
    justify-content: center;
  }

  table {
    width: 90%;
    border-collapse: separate;
    border-spacing: 0;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(212, 175, 55, 0.4); /* sombra dourada suave */
  }

  thead th {
    background-color: #d4af37; /* dourado vivo */
    color: #fff;
    font-weight: 700;
    text-align: center;
    padding: 0.75rem 1rem;
  }

  tbody tr:nth-child(even) {
    background-color: #fcf9f1; /* off-white dourado suave */
  }

  tbody tr:nth-child(odd) {
    background-color: #fffdfa; /* quase branco */
  }

  tbody tr:hover {
    background-color: #f7e8a0; /* dourado claro hover */
    transition: background-color 0.3s ease;
  }

  tbody td {
    padding: 0.75rem 1rem;
    text-align: center;
    color: #5a4d2e; /* marrom-dourado escuro */
  }
</style>
</head>
<body>

<header>
  <nav>
    <a href="{% url 'task_list' %}">Minhas Tarefas</a>
    <a href="{% url 'task_concluidas' %}">Tarefas Concluídas</a>
    <a href="{% url 'task_pendentes' %}">Tarefas Pendentes</a>
  </nav>
</header>

<main class="container">
  <h1>Lista de Tarefas</h1>
  <div class="table-container">
    {% block content %}
    {% endblock %}
  </div>
</main>

</body>
</html>
